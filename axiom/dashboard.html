<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Axiom ROI Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-200 p-8">
    <div class="max-w-5xl mx-auto">
        <h1 class="text-4xl font-bold mb-8 text-blue-500">AXIOM ROI MATRIX</h1>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="bg-slate-900 p-6 rounded-xl border border-slate-800">
                <div id="drop-zone" class="border-2 border-dashed border-blue-500 p-8 text-center cursor-pointer mb-6">
                    <p>Drag & Drop test_10M.csv here</p>
                    <input type="file" id="file-input" class="hidden">
                </div>
                <div class="space-y-4">
                    <div><p class="text-sm">Runs / Day</p><input type="number" id="runs" value="500" class="w-full bg-black p-2 rounded text-green-400"></div>
                    <div><p class="text-sm">Cost / Hr ($)</p><input type="number" id="cost" value="0.60" class="w-full bg-black p-2 rounded text-green-400"></div>
                </div>
            </div>
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-green-500/10 border border-green-500/30 p-8 rounded-2xl">
                    <h2 class="text-xs font-bold text-green-500 uppercase">Annual Savings</h2>
                    <p id="savings" class="text-6xl font-black text-green-400">$0.00</p>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                        <p class="text-xs text-slate-500">GAIN</p>
                        <p id="gain" class="text-2xl font-bold">0.0x</p>
                    </div>
                    <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                        <p class="text-xs text-slate-500">TIME SAVED</p>
                        <p id="ts" class="text-2xl font-bold">0s</p>
                    </div>
                </div>
                <canvas id="chart" height="100"></canvas>
            </div>
        </div>
    </div>
    <script>
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        let chart = new Chart(document.getElementById('chart'), {type: 'bar', data: {labels: ['Pandas', 'Axiom'], datasets: [{data: [0, 0], backgroundColor: ['#475569', '#10b981']}]}, options: {indexAxis: 'y', plugins: {legend: {display: false}}}});
        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => handleFile(e.target.files[0]);
        dropZone.ondrop = (e) => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); };
        dropZone.ondragover = (e) => e.preventDefault();
        async function handleFile(file) {
            const formData = new FormData(); formData.append('file', file);
            const res = await fetch('http://localhost:8000/ingest', {method: 'POST', body: formData});
            const d = await res.json();
            const timeSaved = d.metrics.latency_baseline_s - d.metrics.latency_axiom_s;
            const annual = timeSaved * document.getElementById('runs').value * (document.getElementById('cost').value / 3600) * 365;
            document.getElementById('savings').innerText = `$${annual.toFixed(2)}`;
            document.getElementById('gain').innerText = d.performance_gain;
            document.getElementById('ts').innerText = `${timeSaved.toFixed(3)}s`;
            chart.data.datasets[0].data = [d.metrics.latency_baseline_s, d.metrics.latency_axiom_s];
            chart.update();
        }
    </script>
</body>
</html>
